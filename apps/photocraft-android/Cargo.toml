[package]
name = "photocraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
photocraft-ui-egui = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-format = { workspace = true }
eframe = { workspace = true, default-features = false, features = ["wgpu", "android-native-activity"] }
egui = { workspace = true }
android-activity = { version = "0.6", features = ["native-activity"] }
log = { workspace = true }
android_logger = "0.14"
jni = "0.21"

[package.metadata.android]
package = "ai.storyteller.photocraft"
apk_name = "PhotoCraft"
app_name = "PhotoCraft"
label = "PhotoCraft"
target_sdk_version = 34
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]
